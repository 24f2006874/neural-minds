<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — DRISHTI</title>
<meta name="theme-color" content="#060B14" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: #060B14; color: #E6F1F7;
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px; text-align: center;
  }
  .card {
    max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 18px;
    background: rgba(11, 21, 38, 0.95); border: 1px solid rgba(34, 211, 238, 0.18);
    border-radius: 20px; padding: 40px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }
  .dot { width: 64px; height: 64px; }
  h1 { font-size: 1.35rem; letter-spacing: 0.14em; color: #22D3EE; text-transform: uppercase; }
  h2 { font-size: 1rem; font-weight: 600; }
  p { font-size: 0.875rem; line-height: 1.65; color: #9DB2C4; }
  p strong { color: #34D399; font-weight: 600; }
  button {
    margin-top: 4px; cursor: pointer; border: 1px solid rgba(34, 211, 238, 0.45);
    background: rgba(34, 211, 238, 0.1); color: #22D3EE;
    font: inherit; font-weight: 600; font-size: 0.875rem;
    padding: 10px 22px; border-radius: 999px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  button:hover { background: rgba(34, 211, 238, 0.18); border-color: #22D3EE; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
  <main class="card">
    <svg class="dot" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <defs>
        <radialGradient id="iris" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#22D3EE" />
          <stop offset="70%" stop-color="#0E7490" />
          <stop offset="100%" stop-color="#083344" />
        </radialGradient>
      </defs>
      <path d="M2 20 C10 8, 30 8, 38 20 C30 32, 10 32, 2 20 Z" stroke="#22D3EE" stroke-width="2" fill="rgba(34,211,238,0.06)" />
      <circle cx="20" cy="20" r="8.5" fill="url(#iris)" />
      <circle cx="20" cy="20" r="3.4" fill="#04121c" />
      <circle cx="22.5" cy="17.5" r="1.3" fill="#A5F3FC" />
    </svg>
    <h1>DRISHTI</h1>
    <h2>You&rsquo;re offline</h2>
    <p>
      No network connection right now. Previously loaded DRISHTI screens are
      still available <strong>from the local cache</strong> &mdash; retry when
      you&rsquo;re back online.
    </p>
    <button onclick="location.reload()">Retry connection</button>
  </main>
</body>
</html>
